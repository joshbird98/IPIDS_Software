# Runs the automated tests on every push and pull request (GitHub Actions, Linux).
# Everything runs against simulated hardware - no lab equipment needed.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the example parquet data under data/ (~600 MB) isn't needed by the tests
          sparse-checkout: |
            src
            tests
            config
            plc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt libraries for the offscreen HMI (libpulse0 is for QtMultimedia - alarm sounds)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -m "not slow"

  full-stack:
    name: simulated full stack + HMI
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tests
            config
            plc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt libraries for the offscreen HMI (libpulse0 is for QtMultimedia - alarm sounds)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -m slow
      - name: Service logs (if it failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/ipids_tests_*/
            /tmp/pytest-of-*/
          retention-days: 7
